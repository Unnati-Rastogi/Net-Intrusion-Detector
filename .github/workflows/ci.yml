name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Byte-compile sources
        run: python -m compileall src

      # data/*.csv is gitignored, so the dataset-dependent tests skip
      # automatically (see README / Tests). RUN_SLOW_EVAL_TESTS stays unset:
      # the opt-in slow evaluation suite is not run in CI.
      - name: Run test suite (portable subset)
        run: python -m unittest discover -s tests
